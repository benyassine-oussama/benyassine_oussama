<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENYASSINE OUSSAMA — Visual Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        noir: '#04070d',
                        panel: '#0b1220',
                        blueLux: '#1d2d43',
                        blueSoft: '#8192b3',
                        soft: '#edf5ff',
                        slate: '#a7b5cf'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Cinzel', 'Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --bg-strong: #020406;
            --bg-soft: #0a0f16;
            --panel: #0a0d12;
            --panel-soft: rgba(11, 14, 18, 0.84);
            --accent: #1d2d43;
            --accent-soft: #8192b3;
            --accent-strong: #2a3d59;
            --text: #edf5ff;
            --muted: #a4afc3;
            --line: rgba(42, 61, 89, 0.26);
            --shadow: rgba(0, 0, 0, 0.7);
            --green: #22c55e;
        }

        html { scroll-behavior: smooth; }

        body {
            background:
                radial-gradient(circle at 18% 8%, rgba(67, 90, 122, 0.08), transparent 18%),
                radial-gradient(circle at 72% 18%, rgba(35, 55, 80, 0.08), transparent 22%),
                radial-gradient(circle at 50% 78%, rgba(11, 14, 18, 0.9), transparent 42%),
                linear-gradient(180deg, var(--bg-strong) 0%, #05080d 35%, #090d13 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .blue-text { color: var(--accent-soft); }

        #ambientCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.26;
            filter: blur(0.8px);
        }

        .section-shell {
            background: linear-gradient(180deg, rgba(10, 12, 16, 0.9), rgba(6, 9, 13, 0.9));
            border: 1px solid var(--line);
            box-shadow: 0 28px 60px rgba(0,0,0,0.28);
            backdrop-filter: blur(10px);
        }

        .blue-line {
            height: 1px;
            width: 100px;
            background: linear-gradient(90deg, transparent, var(--accent) 40%, transparent);
            display: block;
            margin: 0.8rem auto 0;
        }

        .luxury-kicker {
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 10px;
            color: var(--muted);
        }

        .hero-copy h1 { text-shadow: 0 10px 30px rgba(0,0,0,0.38); }

        .cta-primary {
            background: linear-gradient(135deg, #101922 0%, #1d2d43 100%);
            color: #edf5ff;
            box-shadow: 0 12px 30px rgba(29, 45, 67, 0.18);
        }

        .cta-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 36px rgba(29, 45, 67, 0.25);
        }

        .cta-secondary {
            border: 1px solid rgba(60, 78, 108, 0.5);
            color: var(--text);
            background: rgba(255,255,255,0.02);
        }

        .glass-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(29,45,67,0.18);
            backdrop-filter: blur(10px);
        }

        .showcase-card,
        .gallery-card,
        .glass-card,
        .section-shell,
        .cta-primary,
        .cta-secondary {
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .showcase-card:hover,
        .gallery-card:hover,
        .glass-card:hover,
        .section-shell:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
        }

        .showcase-card img,
        .gallery-card img {
            transition: transform 0.7s ease, filter 0.6s ease;
        }

        .showcase-card:hover img,
        .gallery-card:hover img {
            transform: scale(1.06);
            filter: saturate(1.05) contrast(1.02);
        }

        .filter-btn {
            transition: all 0.25s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #101922 0%, #1d2d43 100%);
            color: #edf5ff;
            border-color: transparent;
        }

        .form-input,
        .form-textarea,
        .form-select {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(29,45,67,0.18);
            color: white;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: rgba(162, 176, 202, 0.8);
            box-shadow: 0 0 0 1px rgba(162, 176, 202, 0.4);
            outline: none;
        }

        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .lightbox-image-wrap {
            transition: transform 0.42s ease, opacity 0.42s ease;
        }

        .lightbox-image-wrap.swiping {
            transition: none;
        }

        .hero-bg-blur {
            position: absolute;
            inset: 0;
            background: url('hero-bg.jpg') center/cover no-repeat;
            filter: blur(12px) brightness(0.2) saturate(0.35);
            transform: scale(1.08);
            opacity: 0.8;
            z-index: 0;
        }

        .hero-content-shell {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding-top: 4px;
            padding-bottom: 10px;
        }

        .hero-name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hero-name-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4vw, 4.8rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #f2eeee;
            line-height: 1.02;
            text-align: center;
            white-space: nowrap;
        }

        .booking-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 0.8rem 1.5rem;
            border-radius: 999px;
            border: 1px solid rgba(50, 72, 98, 0.45);
            background: rgba(12, 16, 22, 0.72);
            color: var(--text);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 10px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
            animation: bookingBlink 1.3s ease-in-out infinite;
        }

        .booking-pill .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 16px rgba(34,197,94,0.9);
            display: inline-block;
        }

        @keyframes bookingBlink {
            0%, 100% { box-shadow: 0 0 0 rgba(29,45,67,0), 0 14px 32px rgba(0,0,0,0.18); opacity: 1; }
            50% { box-shadow: 0 0 18px rgba(29,45,67,0.18), 0 14px 32px rgba(0,0,0,0.18); opacity: 0.9; }
        }

        .hero-stage {
            position: relative;
            margin-top: 18px;
            height: 450px;
            perspective: 1600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage-rail {
            position: relative;
            width: min(860px, 86vw);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .hero-card {
            position: absolute;
            overflow: hidden;
            border-radius: 26px;
            border: 1px solid rgba(29,45,67,0.2);
            box-shadow: 0 30px 70px rgba(0,0,0,0.5);
            background: rgba(11, 18, 32, 0.9);
            transition: transform 1s cubic-bezier(.22,1,.36,1), opacity 1s ease, filter 1s ease, box-shadow 1s ease;
            user-select: none;
            transform-style: preserve-3d;
        }

        .hero-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .hero-card.left {
            width: 28%;
            height: 62%;
            left: 5%;
            transform: translateX(-18%) rotateY(44deg) rotateX(2deg) translateZ(20px) scale(0.9);
            opacity: 0.86;
            filter: saturate(0.8) brightness(0.78);
            z-index: 1;
        }

        .hero-card.center {
            width: 60%;
            height: 100%;
            transform: translateZ(90px) scale(1.02);
            opacity: 1;
            z-index: 3;
        }

        .hero-card.right {
            width: 28%;
            height: 62%;
            right: 5%;
            transform: translateX(18%) rotateY(-44deg) rotateX(2deg) translateZ(20px) scale(0.9);
            opacity: 0.86;
            filter: saturate(0.8) brightness(0.78);
            z-index: 1;
        }

        .hero-card.left.swipe {
            transform: translateX(-38%) rotateY(52deg) rotateX(10deg) scale(0.82);
            opacity: 0.35;
            filter: blur(1px) brightness(0.6);
        }

        .hero-card.center.swipe {
            transform: translateZ(120px) rotateX(4deg) rotateY(2deg) scale(1.08);
        }

        .hero-card.right.swipe {
            transform: translateX(38%) rotateY(-52deg) rotateX(10deg) scale(0.82);
            opacity: 0.35;
            filter: blur(1px) brightness(0.6);
        }

        .hero-cta-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .cta-main,
        .cta-alt {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.25rem;
            border-radius: 999px;
            min-width: 270px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            font-size: 12px;
        }

        .stats-grid {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.9rem;
        }

        .stat {
            border-radius: 1.15rem;
            border: 1px solid rgba(29,45,67,0.2);
            background: rgba(255,255,255,0.02);
            padding: 1.25rem 0.8rem;
            text-align: center;
        }

        .stat-number {
            font-size: clamp(1.3rem, 3vw, 2.1rem);
            font-family: 'Cinzel', serif;
            color: var(--accent-soft);
            letter-spacing: 0.08em;
            line-height: 1.1;
        }

        .stat-label {
            margin-top: 0.5rem;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #d8c6c6;
        }

        @media (max-width: 640px) {
            .luxury-kicker { letter-spacing: 0.22em; }
            .hero-name-text { letter-spacing: 0.08em; }
            .hero-stage { height: 330px; }
            .cta-main, .cta-alt { min-width: 220px; letter-spacing: 0.16em; }
            .booking-pill { letter-spacing: 0.12em; padding: 0.7rem 1rem; }
        }
    </style>
</head>
