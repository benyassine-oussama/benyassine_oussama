<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENYASSINE OUSSAMA — Visual Artist & Event Photographer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        noir: '#04070d',
                        panel: '#0b1220',
                        blueLux: '#1d2d43',
                        blueSoft: '#8192b3',
                        soft: '#edf5ff',
                        slate: '#a7b5cf'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Cinzel', 'Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #04070d;
            --bg-strong: #020406;
            --bg-soft: #0a0f16;
            --panel: #0b1220;
            --panel-soft: rgba(11, 18, 32, 0.85);
            --accent: #1d2d43;
            --accent-soft: #8192b3;
            --accent-strong: #2a3d59;
            --text: #edf5ff;
            --muted: #a4afc3;
            --line: rgba(42, 61, 89, 0.35);
            --shadow: rgba(0, 0, 0, 0.7);
            --green: #22c55e;
        }

        html { scroll-behavior: smooth; }

        body {
            background:
                radial-gradient(circle at 18% 8%, rgba(67, 90, 122, 0.12), transparent 22%),
                radial-gradient(circle at 72% 18%, rgba(35, 55, 80, 0.12), transparent 28%),
                radial-gradient(circle at 50% 78%, rgba(11, 14, 18, 0.95), transparent 48%),
                linear-gradient(180deg, var(--bg-strong) 0%, #05080d 35%, #090d13 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #ambientCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
            filter: blur(0.5px);
        }

        .section-shell {
            background: linear-gradient(180deg, rgba(11, 18, 32, 0.88), rgba(6, 9, 13, 0.92));
            border: 1px solid var(--line);
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        .luxury-kicker {
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 11px;
            color: var(--accent-soft);
            font-weight: 600;
        }

        /* Buttons & CTAs */
        .cta-main, .cta-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #101922 0%, #1d2d43 100%);
            color: #edf5ff;
            border: 1px solid rgba(129, 146, 179, 0.3);
            box-shadow: 0 12px 30px rgba(29, 45, 67, 0.25);
            transition: all 0.35s ease;
            cursor: pointer;
        }

        .cta-main:hover, .cta-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #182535 0%, #2a3d59 100%);
            box-shadow: 0 16px 38px rgba(29, 45, 67, 0.4);
            border-color: rgba(129, 146, 179, 0.6);
        }

        .cta-alt, .cta-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(129, 146, 179, 0.4);
            color: var(--text);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            transition: all 0.35s ease;
            cursor: pointer;
        }

        .cta-alt:hover, .cta-secondary:hover {
            transform: translateY(-2px);
            background: rgba(29, 45, 67, 0.3);
            border-color: rgba(201, 217, 255, 0.6);
            color: #ffffff;
        }

        .glass-card {
            background: rgba(11, 18, 32, 0.6);
            border: 1px solid rgba(29, 45, 67, 0.3);
            backdrop-filter: blur(12px);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(129, 146, 179, 0.5);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        /* Showcase & Gallery Cards */
        .showcase-card, .gallery-card {
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .showcase-card:hover, .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(129, 146, 179, 0.5);
        }

        .showcase-card img, .gallery-card img {
            transition: transform 0.7s cubic-bezier(0.2, 1, 0.22, 1), filter 0.6s ease;
        }

        .showcase-card:hover img, .gallery-card:hover img {
            transform: scale(1.07);
            filter: saturate(1.1) contrast(1.05);
        }

        /* Filter buttons */
        .filter-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #101922 0%, #1d2d43 100%);
            color: #edf5ff;
            border-color: rgba(129, 146, 179, 0.6);
            box-shadow: 0 6px 20px rgba(29, 45, 67, 0.3);
        }

        /* Forms */
        .form-input, .form-textarea, .form-select {
            background: rgba(11, 18, 32, 0.7);
            border: 1px solid rgba(29, 45, 67, 0.4);
            color: white;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: rgba(129, 146, 179, 0.9);
            box-shadow: 0 0 15px rgba(29, 45, 67, 0.5);
            outline: none;
            background: rgba(15, 23, 42, 0.85);
        }

        /* Scroll reveal animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.2, 1, 0.22, 1), transform 0.8s cubic-bezier(0.2, 1, 0.22, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Hero section styling */
        .hero-bg-blur {
            position: absolute;
            inset: 0;
            background: url('hero-bg.jpg') center/cover no-repeat;
            filter: blur(14px) brightness(0.2) saturate(0.4);
            transform: scale(1.08);
            opacity: 0.8;
            z-index: 0;
        }

        .hero-content-shell {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            margin-bottom: 20px;
        }

        .hero-name-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 5.5vw, 4.8rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #edf5ff;
            line-height: 1.05;
            font-weight: 700;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .booking-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 0.65rem 1.4rem;
            border-radius: 999px;
            border: 1px solid rgba(34, 197, 94, 0.35);
            background: rgba(11, 18, 32, 0.85);
            color: var(--text);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: bookingBlink 2.5s ease-in-out infinite;
        }

        .booking-pill .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }

        @keyframes bookingBlink {
            0%, 100% { border-color: rgba(34, 197, 94, 0.35); box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
            50% { border-color: rgba(34, 197, 94, 0.7); box-shadow: 0 0 15px rgba(34, 197, 94, 0.25); }
        }

        /* 3D Hero Stage Carousel */
        .hero-stage {
            position: relative;
            margin-top: 30px;
            height: 420px;
            perspective: 1400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage-rail {
            position: relative;
            width: min(880px, 92vw);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .hero-card {
            position: absolute;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(129, 146, 179, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            background: rgba(11, 18, 32, 0.95);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1);
            user-select: none;
            cursor: pointer;
        }

        .hero-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-card.left {
            width: 32%;
            height: 72%;
            left: 2%;
            transform: translateX(-10%) rotateY(32deg) translateZ(-50px) scale(0.88);
            opacity: 0.65;
            filter: saturate(0.7) brightness(0.7);
            z-index: 1;
        }

        .hero-card.center {
            width: 58%;
            height: 100%;
            transform: translateZ(80px) scale(1);
            opacity: 1;
            z-index: 3;
            border-color: rgba(129, 146, 179, 0.6);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7);
        }

        .hero-card.right {
            width: 32%;
            height: 72%;
            right: 2%;
            transform: translateX(10%) rotateY(-32deg) translateZ(-50px) scale(0.88);
            opacity: 0.65;
            filter: saturate(0.7) brightness(0.7);
            z-index: 1;
        }

        .hero-cta-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .cta-main, .cta-alt {
            padding: 0.95rem 2.25rem;
            border-radius: 999px;
            min-width: 220px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 600;
        }

        .stats-grid {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }

        .stat {
            border-radius: 1.25rem;
            border: 1px solid rgba(29, 45, 67, 0.4);
            background: rgba(11, 18, 32, 0.5);
            backdrop-filter: blur(10px);
            padding: 1.25rem 0.8rem;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat:hover {
            transform: translateY(-2px);
            border-color: rgba(129, 146, 179, 0.4);
        }

        .stat-number {
            font-size: clamp(1.4rem, 3.2vw, 2.2rem);
            font-family: 'Cinzel', serif;
            color: var(--accent-soft);
            letter-spacing: 0.05em;
            line-height: 1.1;
            font-weight: 700;
        }

        .stat-label {
            margin-top: 0.4rem;
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }

        /* Lightbox Modal */
        #lightboxModal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        @media (max-width: 640px) {
            .hero-stage { height: 280px; }
            .hero-card.left { width: 38%; height: 70%; left: -5%; }
            .hero-card.center { width: 72%; height: 95%; }
            .hero-card.right { width: 38%; height: 70%; right: -5%; }
            .cta-main, .cta-alt { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body class="relative min-h-screen selection:bg-[#1d2d43] selection:text-white">
    <!-- Background Ambient Particle Canvas -->
    <canvas id="ambientCanvas"></canvas>

    <div class="relative z-10">
        <!-- Fixed Header Navigation -->
        <header class="fixed top-0 left-0 right-0 z-40 backdrop-blur-xl bg-black/70 border-b border-[#1d2d43]/40 transition-all duration-300">

                    <button id="menuBtn" onclick="toggleMobileMenu()" aria-label="Toggle Navigation Menu" class="md:hidden text-white p-2.5 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-colors">

                <a href="#showcase" onclick="toggleMobileMenu()" class="block py-2.5 border-b border-white/5 hover:text-[#edf5ff]">Exhibition</a>

                <a href="#about" onclick="toggleMobileMenu()" class="block py-2.5 border-b border-white/5 hover:text-[#edf5ff]">About</a>

                    </a>

            </div>
        </header>

        <!-- Main Content -->
        <main id="top">

            <section class="relative pt-28 pb-20 px-4 sm:px-6 min-h-[92vh] flex flex-col justify-center overflow-hidden">
