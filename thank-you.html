<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | BENYASSINE OUSSAMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            noir: '#04070d',
            panel: '#0b1220',
            blueLux: '#1d2d43',
            blueSoft: '#8192b3',
            soft: '#edf5ff',
            slate: '#a7b5cf'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Cinzel', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 8%, rgba(67, 90, 122, 0.08), transparent 18%),
        radial-gradient(circle at 72% 18%, rgba(35, 55, 80, 0.08), transparent 22%),
        radial-gradient(circle at 50% 78%, rgba(11, 14, 18, 0.9), transparent 42%),
        linear-gradient(180deg, #020406 0%, #05080d 35%, #090d13 100%);
      color: #edf5ff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .panel {
      width: min(900px, calc(100% - 2rem));
      background: linear-gradient(180deg, rgba(10, 12, 16, 0.9), rgba(6, 9, 13, 0.9));
      border: 1px solid rgba(42, 61, 89, 0.26);
      box-shadow: 0 28px 60px rgba(0,0,0,0.28);
      border-radius: 30px;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .kicker {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 10px;
      color: #a4afc3;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 4vw, 4rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
      color: #edf5ff;
    }

    .message {
      margin-top: 1.8rem;
      font-size: clamp(1.1rem, 2vw, 2rem);
      line-height: 1.5;
      color: #edf5ff;
    }

    .message span {
      color: #8192b3;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
      padding: 1rem 2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #101922 0%, #1d2d43 100%);
      color: #edf5ff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 10px;
      border: 1px solid rgba(50, 72, 98, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(29, 45, 67, 0.25);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="kicker">Inquiry Sent</div>
    <h1>Thank You</h1>
    <p class="message">
      Thank you for your inquiry.<br />
      <span>Your message has been received successfully.</span><br />
      I will get back to you as soon as possible.
    </p>
    <a href="index.html" class="button">Back to Home</a>
  </div>
</body>
</html>
